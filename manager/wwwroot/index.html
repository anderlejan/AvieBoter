<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data:">
<title>AvieBoter</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="usernotes/usernotes.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <div class="navbtns"><button id="navBack" class="hb nb" title="Back" disabled>◀</button><button id="navFwd" class="hb nb" title="Forward" disabled>▶</button><button id="navList" class="hb nb" title="Places you visited">🕘</button></div>
  <div class="brand"><img src="icon.png" alt=""><span>AvieBoter</span><small id="ver"></small></div>
  <div id="summary" class="muted"></div>
  <div class="hbtns">
    <button id="btnAdd" class="hb pri" title="Add a bot avatar">＋ Add bot</button>
    <button id="btnSettings" class="hb" title="App settings">⚙ Settings</button>
    <button id="btnNotes" class="hb" title="Collect wanted changes and turn them into a prompt or feedback">📝 User notes</button>
    <button id="btnHelp" class="hb" title="Help">? Help</button>
  </div>
</header>
<div id="updBanner" class="banner info hidden" style="margin:8px 12px 0"></div>
<div id="layout">
  <aside id="side">
    <div id="botList"></div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast" role="status"></div>
<div id="dlgHost"></div>
<script src="usernotes/usernotes-core.js"></script>
<script src="usernotes/usernotes-ui.js"></script>
<script src="app.js"></script>
</body>
</html>
